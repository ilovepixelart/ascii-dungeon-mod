name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly against the newest Claude Code: the mod API is early access and
    # can change between releases without notice.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # uvx runs ruff over the Python tools, one of the gates. No lockfile keys a uv cache, so one would never refresh.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code version
        run: claude --version

      # One script holds every gate, so a green local run is the same check.
      - name: Gates
        run: node scripts/gates.mjs
