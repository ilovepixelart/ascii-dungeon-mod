name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly against the newest Claude Code: the mod API is early access and
    # can change between releases without notice.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # uvx runs ruff over the Python tools, one of the gates.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code version
        run: claude --version

      # One script holds every gate, so a green local run is the same check.
      - name: Gates
        run: node scripts/gates.mjs
